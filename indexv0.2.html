<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Horizon Minimalist Starter | Portfolio</title>
    <meta name="description" content="A high-performance minimalist portfolio focused on vector motion and natural colors for Tyler jackson. Will have links tosocial sites and examples of work">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top-Left Bird -->
    <svg class="corner-bird bird-tl" viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
        <path d="M 10,40 Q 25,10 50,40 Q 75,10 90,40" fill="none" stroke="var(--accent-glow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <!-- Main Navigation Overlay (Absolute/Fixed) -->
    <nav class="main-nav">
        <a href="index.html" class="nav-link active-nav">Portfolio</a>
        <span class="nav-separator">|</span>
        <a href="blog.html" class="nav-link">Journal</a>
    </nav>

    <!-- Top-Right Bird (Optional mirroring, but design says top-left and bottom-right) -->

    <!-- Main Content -->
    <div class="scroll-container">
        <!-- Header: The Sky Entrance -->
        <header class="section header-section active">
            <div class="content-wrapper">
                <h1>Tyler G Jackson</h1>
                <p>Networks, Deployments, Automations, and Integrations</p>
                <div class="scroll-prompt">
                    <span>Scroll to explore</span>
                    <div class="prompt-line"></div>
                </div>
            </div>
        </header>

        <!-- Dynamic Horizontal Line Separator -->
        <div class="horizontal-line-wrapper">
            <div class="horizontal-line"></div>
        </div>

        <!-- Body Section 1 -->
        <section class="section body-section" id="projects">
            <div class="content-wrapper">
                <h2>Selected Works</h2>
                <ul class="portfolio-links">
                    <li><a href="https://TJLink.me">Project Links <span class="arrow">↓</span></a></li>
                    <li><a href="https://SouthWEX.com">Project SouthWEX <span class="arrow">↓</span></a></li>
                    <li><a href="#">Project GWare <span class="arrow">↓</span></a></li>
                </ul>
            </div>
        </section>

        <!-- Dynamic Horizontal Line Separator -->
        <div class="horizontal-line-wrapper">
            <div class="horizontal-line"></div>
        </div>

        <!-- Body Section 2 -->
        <section class="section body-section" id="about">
            <div class="content-wrapper">
                <h2>The Flow</h2>
                <p>Sample, Develop, Deploy, Configure, Test, Live</p>
            </div>
        </section>

        <!-- Dynamic Horizontal Line Separator -->
        <div class="horizontal-line-wrapper">
            <div class="horizontal-line"></div>
        </div>

        <!-- Footer: The Deep Ground -->
        <footer class="section footer-section" id="contact">
            <div class="content-wrapper">
                <h2>Reach Tyler Today</h2>
                <a href="mailto:tylerjacksoncontact@gmail.com" class="contact-link">tylerjacksoncontact@gmail.com</a>
            </div>
        </footer>
    </div>

    <!-- Bottom-Right Bird -->
    <svg class="corner-bird bird-br" viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
        <path d="M 10,40 Q 25,10 50,40 Q 75,10 90,40" fill="none" stroke="var(--accent-glow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <script src="script.js"></script>
</body>
</html>
